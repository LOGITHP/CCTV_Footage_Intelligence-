services:
  video-intelligence:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: 0
    image: multi-stream-video-intelligence:latest
    container_name: video-intelligence
    ports:
      - "8000:8000"
    environment:
      # --- JWT Authentication (Enforced) ---
      - AUTH_REQUIRED=true
      - JWT_SECRET=meta_hackathon_super_secret_jwt_key_at_least_32_bytes_long!
      - JWT_TOKEN_TTL_SECONDS=3600
      - APP_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=adminpassword123

      # --- Supabase PostgreSQL Database ---
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:Plogithh%40200855@db.iprbivrwcicogcjxzylr.supabase.co:5432/postgres?sslmode=require}

      # --- Actual Video & Data Storage in Docker Volume ---
      - MEDIA_ROOT=/app/data/media
      - DATABASE_PATH=/app/data/video_intelligence.sqlite3
      - AUTH_DATABASE_PATH=/app/data/auth.sqlite3
      - AUDIT_DATABASE_PATH=/app/data/auth.sqlite3

      # --- Meta AI Architecture Stack ---
      - MODEL_PROFILE=sam
      - TRACKER_PROFILE=sam
      - CHAT_MODEL_MODE=meta
      - META_API_KEY=b10_nVtchD9y.qWy7Pmz8Glauaka2Z1A4Tlrwr4dQy5gL
      - META_API_URL=https://inference.baseten.co/v1
      - META_MODEL=meta-models/muse-spark-open-1026

      # --- Qdrant Cloud Vector Storage ---
      - QDRANT_URL=https://6b0d33bb-ed40-4932-b576-d73fb0d8bce0.sa-east-1-0.aws.cloud.qdrant.io
      - QDRANT_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6NzgyNWY1ZTItZjRiNi00ZjEzLTk2YmQtYjA1MDIwOGYwMDZiIn0._Wq5qyrC0AeFJwAZieBzQsz_baWyA3vdNEX3hwTsiaA
      - QDRANT_COLLECTION=video-events

      # --- Baseten Model Services (SAM 3.1, SigLIP2, BGE-M3) ---
      - BASETEN_API_KEY=b10_nVtchD9y.qWy7Pmz8Glauaka2Z1A4Tlrwr4dQy5gL
      - BASETEN_SAM_ENDPOINT=${BASETEN_SAM_ENDPOINT:-https://model-sam-3-1.api.baseten.co/production/predict}
      - BASETEN_SIGLIP_ENDPOINT=${BASETEN_SIGLIP_ENDPOINT:-https://model-siglip2.api.baseten.co/production/predict}
      - BASETEN_BGE_ENDPOINT=${BASETEN_BGE_ENDPOINT:-https://model-bge-m3.api.baseten.co/production/predict}

    volumes:
      # Persistent Docker volume storing actual video recordings, evidence clips, and databases
      - video_data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  video_data:
    name: video_intelligence_actual_media
    driver: local
