services:
  video-intelligence:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: 0
    image: multi-stream-video-intelligence:latest
    container_name: video-intelligence
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # --- JWT Authentication (Enforced) ---
      - AUTH_REQUIRED=true
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_TOKEN_TTL_SECONDS=3600
      - APP_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - ALLOW_PUBLIC_SIGNUP=true

      # --- Supabase PostgreSQL Database (IPv4 Pooler Compatible with Docker Bridge) ---
      - DATABASE_URL=${DATABASE_URL:-}

      # --- Object Storage (Default local; switch to minio when running minio profile) ---
      - OBJECT_STORAGE_BACKEND=${OBJECT_STORAGE_BACKEND:-local}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_BUCKET=${MINIO_BUCKET:-video-intelligence}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      - S3_REGION=us-east-1

      # --- Local Persistent Storage Root ---
      - MEDIA_ROOT=/app/data/media
      - DATABASE_PATH=/app/data/video_intelligence.sqlite3
      - AUTH_DATABASE_PATH=/app/data/auth.sqlite3
      - AUDIT_DATABASE_PATH=/app/data/auth.sqlite3

      # --- Meta AI Architecture Stack ---
      - MODEL_PROFILE=sam
      - TRACKER_PROFILE=sam
      - CHAT_MODEL_MODE=meta

      # SAM 3.1: Uses Meta Direct API
      - SAM_MODEL_MODE=meta
      - META_API_KEY=${META_API_KEY:-}
      - META_API_URL=https://api.meta.ai/v1

      # Muse Spark LLM: Uses Baseten Model API ($100 credit + 2M TPM)
      - BASETEN_API_KEY=${BASETEN_API_KEY:-}
      - BASETEN_INFERENCE_URL=https://inference.baseten.co/v1
      - META_MODEL=meta-models/muse-spark-open-1026

      # SigLIP 2 & BGE-M3: Run in container
      - SIGLIP_MODEL=google/siglip2-base-patch16-224
      - BGE_MODEL=BAAI/bge-m3
      - BASETEN_SIGLIP_ENDPOINT=
      - BASETEN_BGE_ENDPOINT=

      # --- Qdrant Cloud Vector Storage ---
      - QDRANT_URL=https://6b0d33bb-ed40-4932-b576-d73fb0d8bce0.sa-east-1-0.aws.cloud.qdrant.io
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=video-events

    volumes:
      # Persistent Docker volume storing local video recordings, evidence clips, and caches
      - video_data:/app/data
      - model_cache:/root/.cache/huggingface
      - ./backend/src:/app/backend/src
      - ./frontend:/app/frontend

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # Optional local MinIO container profile (requires Docker Hub login or authenticated registry)
  # Standalone Telegram Alert & Bot Dispatch Service
  telegram-bot-server:
    build:
      context: .
      dockerfile: telegram_bot_server/Dockerfile
    image: vi-sentry-telegram:latest
    container_name: video-intelligence-telegram
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_ALERT_SHARED_SECRET=${TELEGRAM_ALERT_SHARED_SECRET:-}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - VIDEO_INTELLIGENCE_API_URL=http://video-intelligence:8000
      - VIDEO_INTELLIGENCE_API_TOKEN=${VIDEO_INTELLIGENCE_API_TOKEN:-}
    depends_on:
      video-intelligence:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: video-intelligence-minio
    restart: unless-stopped
    profiles:
      - minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  video_data:
    name: video_intelligence_actual_media
    driver: local
  minio_data:
    name: video_intelligence_minio_data
    driver: local
  model_cache:
    name: video_intelligence_model_cache
    driver: local
